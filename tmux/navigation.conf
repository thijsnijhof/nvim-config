# Neovim receives the key and moves through its splits before crossing to tmux.
# Foreground process check follows vim-tmux-navigator's documented approach.
is_nvim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]*/)?n?vim(diff)?$'"
bind-key -n C-h if-shell "$is_nvim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_nvim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_nvim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_nvim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode C-h select-pane -L
bind-key -T copy-mode C-j select-pane -D
bind-key -T copy-mode C-k select-pane -U
bind-key -T copy-mode C-l select-pane -R
# Ctrl-l is now navigation; prefix then Ctrl-l still sends clear-screen.
bind-key C-l send-keys C-l
