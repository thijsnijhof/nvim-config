# Load with: tmux source-file /absolute/path/to/themes/neon-dusk.tmux.conf
set -g status-style 'bg=#231535,fg=#e5d9f2'
set -g status-left-length 30
set -g status-left '#[fg=#190f28,bg=#ff4fbc,bold] #S #[default] '
set -g status-right '#[fg=#36e5da]%H:%M #[fg=#a58bb8]%d %b '
set -g window-status-format ' #I:#W '
set -g window-status-style 'fg=#a58bb8,bg=#231535'
set -g window-status-current-format ' #I:#W '
set -g window-status-current-style 'fg=#190f28,bg=#36e5da,bold'
set -g pane-border-style 'fg=#452454'
set -g pane-active-border-style 'fg=#ff4fbc'
set -g message-style 'fg=#e5d9f2,bg=#452454'
set -g mode-style 'fg=#190f28,bg=#bd93f9'
